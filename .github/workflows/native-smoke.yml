name: Build and smoke-test native MineMine server
on:
  workflow_dispatch:
    inputs:
      load_clients:
        description: Maximum disposable browser clients (16 routine; 20 or 32 opt-in)
        type: choice
        default: '16'
        options:
          - '16'
          - '20'
          - '32'
  pull_request:
    paths:
      - '.github/workflows/native-smoke.yml'
      - 'game/**'
      - 'server/**'
      - 'playtest/**'
      - 'test/integration/browser-native.mjs'
      - 'test/integration/browser-native-load.mjs'
      - 'test/integration/browser-native-restart.mjs'
      - 'test/integration/wallet-ui-evm.mjs'
      - 'test/integration/admin-beta-ui.mjs'
      - 'test/integration/beta-player-ui.mjs'
      - 'test/integration/managed-name-ui.mjs'
      - 'test/integration/map-ui.mjs'
      - 'test/integration/host-proxy.mjs'
      - 'test/integration/pages-landing.mjs'
      - 'test/integration/account-ui.mjs'
      - 'test/integration/town_probe/**'
      - 'test/integration/load_probe/**'
      - 'test/integration/map_edit_probe/**'
      - 'package.json'
      - 'scripts/setup-world.mjs'
      - 'scripts/sample-stack-memory.sh'
      - 'scripts/sample-client-runner.sh'
      - 'scripts/ci-native-service.sh'
      - 'scripts/ci-api-service.sh'
      - 'scripts/ci-deploy-economy.mjs'
      - 'scripts/package-host-runtime.sh'
      - 'scripts/build-account.mjs'
      - 'client/account.jsx'
      - 'public/account/**'
      - 'scripts/build-minetestmapper.sh'
      - 'scripts/publish-map-from-backup.mjs'
      - 'scripts/ci-mapserver-smoke.sh'
      - 'scripts/ci-host-stack-smoke.sh'
      - 'scripts/ci-build-patched-mapserver.sh'
      - 'patches/mapserver/**'
      - 'scripts/ci-static-map-snapshot.sh'
      - 'public/map/**'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/style.css'
      - 'deploy/vps/**'
      - 'upstream.sources.json'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      LOAD_MAX_CLIENTS: ${{ inputs.load_clients || '16' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared 1 GiB and one-vCPU service limits
        run: |
          sudo systemctl set-property --runtime minemine-ci.slice MemoryAccounting=yes MemoryMax=1G MemorySwapMax=0 CPUAccounting=yes CPUQuota=100%
          test "$(systemctl show -P MemoryMax minemine-ci.slice)" = '1073741824'
          test "$(systemctl show -P MemorySwapMax minemine-ci.slice)" = '0'
          sudo systemd-run --quiet --unit=minemine-ci-probe --slice=minemine-ci.slice --uid="$USER" --property=Type=exec /usr/bin/sleep 10
          test "$(systemctl show -P Slice minemine-ci-probe.service)" = 'minemine-ci.slice'
          cgroup=$(systemctl show -P ControlGroup minemine-ci.slice)
          test "$(cat "/sys/fs/cgroup$cgroup/memory.max")" = '1073741824'
          test "$(cat "/sys/fs/cgroup$cgroup/memory.swap.max")" = '0'
          awk '{ if ($1 != $2) exit 1 }' "/sys/fs/cgroup$cgroup/cpu.max"
          sudo systemctl stop minemine-ci-probe.service
      - name: Install dependencies from the pinned Luanti Linux guide
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake ninja-build sqlite3 libpng-dev libjpeg-dev libgd-dev libgl1-mesa-dev libsqlite3-dev libogg-dev libvorbis-dev libopenal-dev libcurl4-gnutls-dev libfreetype6-dev zlib1g-dev libgmp-dev libjsoncpp-dev libzstd-dev libluajit-5.1-dev gettext libsdl2-dev
      - name: Fetch pinned engine and game
        run: node scripts/fetch-upstream.mjs
      - name: Build native server
        run: |
          cmake -S vendor/native -B runtime/native-build -G Ninja -DBUILD_CLIENT=FALSE -DBUILD_SERVER=TRUE -DRUN_IN_PLACE=TRUE -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/native-build -j 2
          vendor/native/bin/luantiserver --version
      - name: Start world with wallet and town mods
        run: |
          cp -a vendor/game vendor/native/games/minetest
          WORLD_DIR="$GITHUB_WORKSPACE/runtime/native-world" node scripts/setup-world.mjs
          set +e
          (cd vendor/native && timeout --signal=INT 15s bin/luantiserver --info --world "$GITHUB_WORKSPACE/runtime/native-world" --config "$GITHUB_WORKSPACE/game/minetest.conf" --logfile "$GITHUB_WORKSPACE/runtime/native-smoke.log") > runtime/native-console.log 2>&1
          result=$?
          set -e
          cat runtime/native-console.log
          cat runtime/native-smoke.log
          if [ "$result" -ne 124 ]; then
            echo "Native server exited before the smoke-test interval (status $result)."
            exit 1
          fi
          grep -Fq 'Mod "wallet_auth" loaded' runtime/native-console.log
          grep -Fq 'Mod "town_claims" loaded' runtime/native-console.log
          grep -Fq 'Mod "world_map_spawn" loaded' runtime/native-console.log
          grep -Fq 'listening on 127.0.0.1:30000' runtime/native-console.log
          if grep -Fq 'ERROR[Main]' runtime/native-console.log; then
            echo 'Native server logged an error while starting the world.'
            exit 1
          fi
          WORLD_DIR="$GITHUB_WORKSPACE/runtime/native-world" node scripts/check-native-metrics.mjs
      - name: Restore a stopped-world backup and restart
        run: |
          tar -C runtime -czf runtime/native-world-backup.tar.gz native-world
          mkdir -p runtime/restore
          tar -C runtime/restore -xzf runtime/native-world-backup.tar.gz
          set +e
          (cd vendor/native && timeout --signal=INT 8s bin/luantiserver --info --world "$GITHUB_WORKSPACE/runtime/restore/native-world" --config "$GITHUB_WORKSPACE/game/minetest.conf" --logfile "$GITHUB_WORKSPACE/runtime/restore-smoke.log") > runtime/restore-console.log 2>&1
          result=$?
          set -e
          cat runtime/restore-console.log
          if [ "$result" -ne 124 ]; then
            echo "Restored world exited before the smoke-test interval (status $result)."
            exit 1
          fi
          grep -Fq 'Server for gameid="minetest" listening on 127.0.0.1:30000' runtime/restore-console.log
          if grep -Fq 'ERROR[Main]' runtime/restore-console.log; then
            echo 'Restored world logged an error.'
            exit 1
          fi
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise wallet transfer and paid town credits in Chromium
        run: npm run test:wallet-ui
      - name: Exercise beta admin controls in Chromium
        run: npm run test:admin-ui
      - name: Exercise local ZeroDev account lab in Chromium
        run: |
          npm run account:build
          node test/integration/account-ui.mjs
      - name: Exercise player beta redemption in Chromium
        run: npm run test:beta-player-ui
      - name: Exercise managed-name term in Chromium
        run: npm run test:managed-name-ui
      - uses: actions/download-artifact@v4
        with:
          name: miners-solo-playtest
          github-token: ${{ github.token }}
          run-id: '39900170530'
          path: runtime/downloaded-build
      - name: Stage pinned browser engine and adapter
        run: |
          cp -a runtime/downloaded-build/public/engine public/engine
          npm run adapter:install
      - name: Exercise Pages landing in Chromium
        run: |
          PAGES_SITE_DIR="$GITHUB_WORKSPACE/runtime/pages-smoke" node scripts/prepare-pages-playtest.mjs
          PAGES_SITE_DIR="$GITHUB_WORKSPACE/runtime/pages-smoke" node test/integration/pages-landing.mjs
      - name: Build pinned world mapper for host archive
        run: bash scripts/build-minetestmapper.sh
      - name: Package and test relocated host runtime
        run: |
          bash scripts/package-host-runtime.sh runtime/minemine-host-runtime-ubuntu22-x64.tar.gz
          (cd runtime && sha256sum -c minemine-host-runtime-ubuntu22-x64.tar.gz.sha256)
          mkdir -p runtime/host-bundle-check
          tar -C runtime/host-bundle-check -xzf runtime/minemine-host-runtime-ubuntu22-x64.tar.gz
          test -x runtime/host-bundle-check/vendor/native/bin/luantiserver
          test -f runtime/host-bundle-check/.env.example
          test -f runtime/host-bundle-check/public/account/account.js
          test -f runtime/host-bundle-check/public/account/account.js.LEGAL.txt
          test -f runtime/host-bundle-check/public/engine/adapter.js
          test -f runtime/host-bundle-check/deploy/vps/backup-world.sh
          test -x runtime/host-bundle-check/vendor/mapper/minetestmapper
          test -f runtime/host-bundle-check/vendor/mapper/colors.txt
          test -f runtime/host-bundle-check/vendor/mapper/COPYING
          test -f runtime/host-bundle-check/vendor/mapper/AUTHORS
          test -f runtime/host-bundle-check/scripts/publish-map-from-backup.mjs
          test -f runtime/host-bundle-check/scripts/sync-spacetime-profiles.mjs
          node --check runtime/host-bundle-check/scripts/sync-spacetime-profiles.mjs
          test -z "$(ldd runtime/host-bundle-check/vendor/mapper/minetestmapper | grep 'not found' || true)"
          test -f runtime/host-bundle-check/test/integration/ens-live.mjs
          test -f runtime/host-bundle-check/vendor/native/games/minetest/game.conf
          set +e
          (cd runtime/host-bundle-check/vendor/native && timeout --signal=INT 8s bin/luantiserver --info --world "$GITHUB_WORKSPACE/runtime/restore/native-world" --config "$GITHUB_WORKSPACE/runtime/host-bundle-check/game/minetest.conf" --logfile "$GITHUB_WORKSPACE/runtime/host-bundle-check-smoke.log") > runtime/host-bundle-check-console.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            cat runtime/host-bundle-check-console.log
            echo "Relocated native runtime exited before the smoke interval (status $result)."
            exit 1
          fi
          grep -Fq 'listening on 127.0.0.1:30000' runtime/host-bundle-check-console.log
          grep -Fq 'Mod "wallet_auth" loaded' runtime/host-bundle-check-console.log
          grep -Fq 'Mod "town_claims" loaded' runtime/host-bundle-check-console.log
          grep -Fq 'Mod "world_map_spawn" loaded' runtime/host-bundle-check-console.log
      - name: Two browser wallets join native world
        run: |
          set -euo pipefail
          cp -a test/integration/town_probe runtime/native-world/worldmods/town_probe
          cp -a test/integration/load_probe runtime/native-world/worldmods/load_probe
          printf '\nload_mod_town_probe = true\nload_mod_load_probe = true\n' >> runtime/native-world/world.mt
          case "$LOAD_MAX_CLIENTS" in
            16) load_deadline= ;;
            20) load_deadline=30m ;;
            32) load_deadline=25m ;;
            *) echo 'Unsupported load-client count.' >&2; exit 2 ;;
          esac
          sed "s/^max_users = 2$/max_users = $LOAD_MAX_CLIENTS/" game/minetest.conf > runtime/ci-minetest.conf
          grep -Fxq "max_users = $LOAD_MAX_CLIENTS" runtime/ci-minetest.conf
          world_dir="$GITHUB_WORKSPACE/runtime/native-world"
          node_binary=$(command -v node)
          start_stack() {
            local phase=$1
            local engine_log=$2
            local native_log=$3
            local api_log=$4
            sudo systemd-run --quiet --unit="minemine-ci-native-$phase" --slice=minemine-ci.slice --uid="$USER" --same-dir --property=Type=exec \
              /usr/bin/bash "$GITHUB_WORKSPACE/scripts/ci-native-service.sh" "$world_dir" "$GITHUB_WORKSPACE/runtime/$engine_log" "$GITHUB_WORKSPACE/runtime/$native_log" "$GITHUB_WORKSPACE/runtime/ci-minetest.conf"
            sudo systemd-run --quiet --unit="minemine-ci-api-$phase" --slice=minemine-ci.slice --uid="$USER" --same-dir --property=Type=exec \
              /usr/bin/bash "$GITHUB_WORKSPACE/scripts/ci-api-service.sh" "$world_dir" "$GITHUB_WORKSPACE/runtime/$api_log" "$node_binary" "$GITHUB_WORKSPACE/runtime/ci-economy.env"
            test "$(systemctl show -P Slice "minemine-ci-native-$phase.service")" = 'minemine-ci.slice'
            test "$(systemctl show -P Slice "minemine-ci-api-$phase.service")" = 'minemine-ci.slice'
          }
          wait_game_ready() {
            for attempt in {1..20}; do
              if curl -fsS http://localhost:3000/api/health | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const health = JSON.parse(input); process.exit(health.nativeReady && health.gameReady ? 0 : 1); });'; then
                return 0
              fi
              sleep 1
            done
            echo 'Native heartbeat did not make the wallet game ready.'
            curl -fsS http://localhost:3000/api/health
            return 1
          }
          capture_cgroup() {
            local phase=$1
            local cgroup
            cgroup=$(systemctl show -P ControlGroup minemine-ci.slice)
            if [ -n "$cgroup" ] && [ -f "/sys/fs/cgroup$cgroup/memory.peak" ]; then
              cat "/sys/fs/cgroup$cgroup/memory.peak" > "runtime/server-cgroup-$phase-peak-bytes.txt"
              cat "/sys/fs/cgroup$cgroup/memory.events" > "runtime/server-cgroup-$phase-events.txt"
              cat "/sys/fs/cgroup$cgroup/cpu.stat" > "runtime/server-cgroup-$phase-cpu-stat.txt"
              cat "/sys/fs/cgroup$cgroup/cpu.max" > "runtime/server-cgroup-$phase-cpu-max.txt"
            fi
          }
          cleanup() {
            touch runtime/server-memory-first.stop runtime/server-memory-restart.stop runtime/client-runner.stop
            capture_cgroup "$current_phase"
            sudo systemctl stop minemine-ci-api-first.service minemine-ci-native-first.service minemine-ci-api-restart.service minemine-ci-native-restart.service minemine-ci-anvil.service 2>/dev/null || true
          }
          current_phase=first
          trap cleanup EXIT
          # The disposable payment chain runs outside the 1 GiB Luanti/Node
          # service slice. The production VM will use an external RPC.
          sudo systemd-run --quiet --unit=minemine-ci-anvil --uid="$USER" --same-dir --property=Type=exec \
            "$node_binary" "$GITHUB_WORKSPACE/node_modules/@foundry-rs/anvil/bin.mjs" \
            --quiet --host 127.0.0.1 --port 8545 --chain-id 31337 --accounts 3 --no-cors
          for attempt in {1..30}; do
            if curl -fsS -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.exit(JSON.parse(input).result === "0x7a69" ? 0 : 1));'; then break; fi
            if ! systemctl is-active --quiet minemine-ci-anvil.service; then echo 'CI Anvil exited before RPC readiness.'; exit 1; fi
            sleep 1
          done
          node scripts/ci-deploy-economy.mjs runtime/ci-economy.env
          set -a
          source runtime/ci-economy.env
          set +a
          start_stack first browser-native-engine.log browser-native.log browser-api.log
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            if ! systemctl is-active --quiet minemine-ci-api-first.service; then cat runtime/browser-api.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health > /dev/null
          for attempt in {1..30}; do
            if grep -Fq 'listening on 127.0.0.1:30000' runtime/browser-native.log; then break; fi
            if ! systemctl is-active --quiet minemine-ci-native-first.service; then cat runtime/browser-native.log; exit 1; fi
            sleep 1
          done
          grep -Fq 'listening on 127.0.0.1:30000' runtime/browser-native.log
          wait_game_ready
          cgroup=$(systemctl show -P ControlGroup minemine-ci.slice)
          test -n "$cgroup"
          test "$(cat "/sys/fs/cgroup$cgroup/memory.max")" = '1073741824'
          test "$(cat "/sys/fs/cgroup$cgroup/memory.swap.max")" = '0'
          awk '{ if ($1 != $2) exit 1 }' "/sys/fs/cgroup$cgroup/cpu.max"
          native_pid=$(systemctl show -P MainPID minemine-ci-native-first.service)
          api_pid=$(systemctl show -P MainPID minemine-ci-api-first.service)
          test "$native_pid" -gt 1
          test "$api_pid" -gt 1
          bash scripts/sample-stack-memory.sh "$native_pid" "$api_pid" runtime/server-memory-first.csv runtime/server-memory-first.stop &
          sampler_pid=$!
          WORLD_DIR="$GITHUB_WORKSPACE/runtime/native-world" NATIVE_LOG=runtime/browser-native.log node test/integration/browser-native.mjs
          rm -f runtime/client-runner.stop
          bash scripts/sample-client-runner.sh runtime/client-runner.csv runtime/client-runner.stop &
          client_sampler_pid=$!
          if [ -n "$load_deadline" ]; then
            # Finish an optional rehearsal before the 50-minute job limit so
            # the EXIT trap and always-run artifact upload retain partial data.
            timeout --signal=TERM --kill-after=15s "$load_deadline" \
              env WORLD_DIR="$GITHUB_WORKSPACE/runtime/native-world" NATIVE_LOG=runtime/browser-native.log \
              node test/integration/browser-native-load.mjs
          else
            WORLD_DIR="$GITHUB_WORKSPACE/runtime/native-world" NATIVE_LOG=runtime/browser-native.log \
              node test/integration/browser-native-load.mjs
          fi
          touch runtime/client-runner.stop
          wait "$client_sampler_pid"
          awk -F, 'NR > 2 && $5 ~ /^[0-9]+(\.[0-9]+)?$/ && $5 <= 100 &&
            $6 ~ /^[0-9]+(\.[0-9]+)?$/ && $6 <= 100 && $8 > 0 { valid++ }
            END { if (valid < 1) exit 1 }' runtime/client-runner.csv
          touch runtime/server-memory-first.stop
          wait "$sampler_pid"
          capture_cgroup first
          sudo systemctl stop minemine-ci-api-first.service minemine-ci-native-first.service
          current_phase=restart
          start_stack restart browser-native-restart-engine.log browser-native-restart.log browser-api-restart.log
          for attempt in {1..30}; do
            if grep -Fq 'listening on 127.0.0.1:30000' runtime/browser-native-restart.log; then break; fi
            if ! systemctl is-active --quiet minemine-ci-native-restart.service; then cat runtime/browser-native-restart.log; exit 1; fi
            sleep 1
          done
          grep -Fq 'listening on 127.0.0.1:30000' runtime/browser-native-restart.log
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            if ! systemctl is-active --quiet minemine-ci-api-restart.service; then cat runtime/browser-api-restart.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health > /dev/null
          wait_game_ready
          native_pid=$(systemctl show -P MainPID minemine-ci-native-restart.service)
          api_pid=$(systemctl show -P MainPID minemine-ci-api-restart.service)
          test "$native_pid" -gt 1
          test "$api_pid" -gt 1
          bash scripts/sample-stack-memory.sh "$native_pid" "$api_pid" runtime/server-memory-restart.csv runtime/server-memory-restart.stop &
          sampler_pid=$!
          WORLD_DIR="$GITHUB_WORKSPACE/runtime/native-world" NATIVE_LOG=runtime/browser-native-restart.log node test/integration/browser-native-restart.mjs
          touch runtime/server-memory-restart.stop
          wait "$sampler_pid"
          capture_cgroup restart
          # The slice may persist between service generations; the second peak
          # can include the first session rather than resetting at restart.
          for phase in first restart; do
            test "$(awk '$1 == "oom_kill" { print $2 }' "runtime/server-cgroup-$phase-events.txt")" = '0'
            printf 'Cgroup peak through %s phase: %s bytes; OOM kills: 0\n' "$phase" "$(cat "runtime/server-cgroup-$phase-peak-bytes.txt")"
          done | tee runtime/server-cgroup-summary.txt
          for sample in runtime/server-memory-first.csv runtime/server-memory-restart.csv; do
            awk -F, 'NR > 1 { if ($4 > peak) peak = $4; count++ } END { if (!count) exit 1; printf "%s: %d samples, peak Luanti + Node RSS %.1f MiB\n", FILENAME, count, peak / 1024 }' "$sample"
          done | tee runtime/server-memory-summary.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.12'
          cache: false
      - name: Build and test pinned mapserver sequence patch
        run: bash scripts/ci-build-patched-mapserver.sh
      - name: Rehearse native world, API, and patched live map within 768 MiB
        run: |
          sudo systemctl set-property --runtime minemine-map-ci.slice MemoryAccounting=yes MemoryMax=768M MemorySwapMax=0
          test "$(systemctl show -P MemoryMax minemine-map-ci.slice)" = '805306368'
          test "$(systemctl show -P MemorySwapMax minemine-map-ci.slice)" = '0'
          sudo systemd-run --quiet --scope --unit=minemine-map-ci-rehearsal --slice=minemine-map-ci.slice --uid="$USER" --same-dir \
            /usr/bin/env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            MAPSERVER_BINARY="$GITHUB_WORKSPACE/runtime/mapserver-patched" \
            MAPSERVER_SEQUENCE_RESTART_PROOF=true \
            MAPSERVER_BURST_PROOF=true MAPSERVER_LIVE_EDIT_PROOF=true MAPSERVER_CAPACITY_PROOF=true \
            NODE_BINARY="$(command -v node)" \
            /usr/bin/bash scripts/ci-mapserver-smoke.sh
      - name: Record copied-world service memory
        if: always()
        run: |
          cgroup=$(systemctl show -P ControlGroup minemine-map-ci.slice 2>/dev/null || true)
          if [ -z "$cgroup" ] || [ ! -f "/sys/fs/cgroup$cgroup/memory.peak" ]; then
            echo 'Map capacity slice was not created.'
            exit 0
          fi
          cat "/sys/fs/cgroup$cgroup/memory.peak" | tee runtime/mapserver-cgroup-peak-bytes.txt
          cat "/sys/fs/cgroup$cgroup/memory.events" | tee runtime/mapserver-cgroup-events.txt
          test "$(cat "/sys/fs/cgroup$cgroup/memory.max")" = '805306368'
          test "$(cat "/sys/fs/cgroup$cgroup/memory.swap.max")" = '0'
          test "$(awk '$1 == "oom_kill" { print $2 }' runtime/mapserver-cgroup-events.txt)" = '0'
      - name: Download checksum-pinned official Caddy for host rehearsal
        run: |
          mkdir -p runtime/host-caddy
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            -o runtime/host-caddy/caddy.tar.gz
          printf '%s  %s\n' 727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b runtime/host-caddy/caddy.tar.gz | sha256sum --check
          tar -C runtime/host-caddy -xzf runtime/host-caddy/caddy.tar.gz caddy
          test -x runtime/host-caddy/caddy
          runtime/host-caddy/caddy version
      - name: Rehearse Caddy, Node and Luanti under 1 GiB and one CPU
        run: |
          sudo systemctl set-property --runtime minemine-host-ci.slice MemoryAccounting=yes MemoryMax=1G MemorySwapMax=0 CPUAccounting=yes CPUQuota=100%
          test "$(systemctl show -P MemoryMax minemine-host-ci.slice)" = '1073741824'
          test "$(systemctl show -P MemorySwapMax minemine-host-ci.slice)" = '0'
          sudo systemd-run --quiet --scope --unit=minemine-host-ci-rehearsal --slice=minemine-host-ci.slice --uid="$USER" --same-dir \
            /usr/bin/env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" NODE_BINARY="$(command -v node)" \
            /usr/bin/bash scripts/ci-host-stack-smoke.sh
      - name: Record one-core host stack resource use
        if: always()
        run: |
          cgroup=$(systemctl show -P ControlGroup minemine-host-ci.slice 2>/dev/null || true)
          if [ -z "$cgroup" ]; then echo 'Host rehearsal slice was not started.'; exit 0; fi
          test -f "/sys/fs/cgroup$cgroup/memory.peak"
          cat "/sys/fs/cgroup$cgroup/memory.peak" | tee runtime/host-cgroup-peak-bytes.txt
          cat "/sys/fs/cgroup$cgroup/memory.events" | tee runtime/host-cgroup-events.txt
          cat "/sys/fs/cgroup$cgroup/cpu.stat" | tee runtime/host-cgroup-cpu-stat.txt
          cat "/sys/fs/cgroup$cgroup/cpu.max" | tee runtime/host-cgroup-cpu-max.txt
          test "$(cat "/sys/fs/cgroup$cgroup/memory.max")" = '1073741824'
          test "$(cat "/sys/fs/cgroup$cgroup/memory.swap.max")" = '0'
          awk '{ if ($1 != $2) exit 1 }' runtime/host-cgroup-cpu-max.txt
          test "$(awk '$1 == "oom_kill" { print $2 }' runtime/host-cgroup-events.txt)" = '0'
      - name: Render a bounded static map from a stopped-world copy
        run: bash scripts/ci-static-map-snapshot.sh
      - name: Exercise the generated world map in Chromium
        run: |
          cp runtime/static-world-map.png public/map/snapshot.png
          cp runtime/static-world-map.json public/map/snapshot.json
          EXPECTED_MAP_SPAWN=1 npm run test:map-ui
      - name: Publish a real map from a verified stopped-world backup
        run: |
          mkdir -p runtime/map-backup
          cp -a runtime/native-world runtime/map-backup/world
          archive="runtime/minemine-world-$(date -u +%Y%m%dT%H%M%SZ)-$$.tar.gz"
          tar -C runtime/map-backup -czf "$archive" world
          (cd runtime && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          node runtime/host-bundle-check/scripts/refresh-map-from-backup.mjs \
            runtime runtime/host-bundle-check
          node runtime/host-bundle-check/scripts/refresh-map-from-backup.mjs \
            runtime runtime/host-bundle-check | tee runtime/map-refresh-skip.log
          grep -q 'Map is already current for latest backup' runtime/map-refresh-skip.log
          cp runtime/host-bundle-check/public/map/snapshot.json public/map/snapshot.json
          cp runtime/host-bundle-check/public/map/snapshot-*.png public/map/
          EXPECTED_MAP_WORLD='MineMine shared world' EXPECTED_MAP_SPAWN=1 npm run test:map-ui
