server_name = MineMine Development World
server_description = Experimental wallet-authenticated Luanti world
server_announce = false
port = 30000
bind_address = 127.0.0.1
# Initial technical-alpha limit; raise only after VPS load measurements.
max_users = 2
# Bound initial map delivery for the small server and browser clients.
# The pinned Luanti default is 12 mapblocks; revisit after FPS/load tests.
max_block_send_distance = 6
enable_damage = true
creative_mode = false
default_privs = interact, shout
enable_rollback_recording = true
secure.enable_security = true
# Keep native UDP private: the browser-facing proxy must only reach this server.
# Explicitly prohibit ordinary guest account creation through the wallet_auth mod.
